name: Release package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # "Run workflow" on main: run the tests, then tag and publish the release for the
  # $plugin->release in version.php (for example 0.1.1 -> tag v0.1.1).
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (Markdown). Leave empty to use CHANGES.md.'
        required: false
        default: ''

# Read-only by default; only the release job may write (tag and release).
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            moodle-branch: 'MOODLE_405_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_500_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_501_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, zip, intl, soap, xmlrpc
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install zbar (QR decoder used by the PHPUnit tests)
        run: sudo apt-get update && sudo apt-get install -y zbar-tools

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish release
    # Runs after every test job has passed, for a pushed version tag (for example v0.1.1)
    # or for "Run workflow" on main, which creates the tag itself.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Work out the release from version.php
        id: version
        run: |
          release=$(grep -oP "release\s*=\s*'\K[^']+" version.php)
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="v${release}"
          else
            tag="${GITHUB_REF_NAME}"
            if [ "v${release}" != "${tag}" ]; then
              echo "Tag ${tag} does not match \$plugin->release '${release}' in version.php" >&2
              exit 1
            fi
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Stop if this release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::notice::Release ${TAG} already exists; nothing to publish."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Build the installable ZIP (top-level folder resourceqr/)
        if: env.SKIP != '1'
        run: |
          git archive --format=zip --prefix=resourceqr/ -o local_resourceqr.zip HEAD -- . ':(exclude)dist' ':(exclude).github'
          unzip -l local_resourceqr.zip | tail -n 1

      - name: Create the GitHub release
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE: ${{ steps.version.outputs.release }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          if [ -n "${NOTES}" ]; then
            printf '%s\n' "${NOTES}" > notes.md
          else
            cp CHANGES.md notes.md
          fi
          # On "Run workflow" the tag does not exist yet: --target creates it on this commit.
          gh release create "${TAG}" local_resourceqr.zip \
            --title "local_resourceqr ${RELEASE}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}"
